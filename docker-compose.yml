services:
  jekyll:
    image: ruby:3.1
    working_dir: /site
    ports:
      - "4000:4000"
    volumes:
      - ./:/site
      - bundle_cache:/usr/local/bundle
    command: >
      bash -c "bundle lock --add-platform x86_64-linux &&
      bundle install &&
      bundle exec jekyll serve --host 0.0.0.0 --force_polling"

volumes:
  bundle_cache:
